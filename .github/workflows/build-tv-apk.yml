name: Build TV test APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check restrictive manifest and bridge
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml
          ! grep -q 'BIND_ACCESSIBILITY_SERVICE' app/src/main/AndroidManifest.xml
          test ! -f app/src/main/java/com/couchframe/tv/RemoteButtonService.kt
          ! grep -q 'addJavascriptInterface(' app/src/main/java/com/couchframe/tv/MainActivity.kt
          ! grep -q 'window.TVApp' app/src/main/assets/tv.js
          grep -q 'https://framextv.pro/' app/src/main/java/com/couchframe/tv/MainActivity.kt
          grep -q 'setAcceptThirdPartyCookies(web, false)' app/src/main/java/com/couchframe/tv/MainActivity.kt
          grep -q 'Pressione VOLTAR novamente' app/src/main/res/values/strings.xml
          grep -q 'Não foi possível acessar o FrameXTV' app/src/main/java/com/couchframe/tv/MainActivity.kt

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install required Android SDK packages (runner SDK)
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"; fi
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Inspect APK and calculate hash
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml > apk-manifest.txt
          ! grep -q 'BIND_ACCESSIBILITY_SERVICE' apk-manifest.txt
          ! grep -q 'android.accessibilityservice' apk-manifest.txt
          ! grep -q 'android:debuggable.*0xffffffff' apk-manifest.txt
          sha256sum "$APK" > apk-sha256.txt

      - name: Prepare APK for direct download
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release.apk FrameXTV-para-TV-pt-BR.apk
          sha256sum FrameXTV-para-TV-pt-BR.apk > FrameXTV-para-TV-pt-BR.apk.sha256

      - name: Publish direct APK download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v1.1.${GITHUB_RUN_NUMBER}-ptbr"
          gh release create "$TAG" \
            "FrameXTV-para-TV-pt-BR.apk" \
            "FrameXTV-para-TV-pt-BR.apk.sha256" \
            --title "FrameXTV para TV — Português do Brasil ($TAG)" \
            --notes "APK de teste para Android TV/Google TV, pronto para baixar diretamente. Sem permissão de Acessibilidade. O conteúdo do site FrameXTV é externo e pode permanecer em inglês. Esta versão usa assinatura de depuração, que pode variar entre builds; ao atualizar pode ser necessário desinstalar a versão antiga. Não desative o Play Protect."
